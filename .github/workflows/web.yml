name: web

# Checks web/ only. Nothing here deploys: demo.koelony.com is built from koelony/demo-site (private)
# since 2026-11-22, and web/ is kept for reference until the model team removes it.

on:
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: ./build.sh
      - name: Syntax check
        run: for f in app.js asr-worker.js hkasr-lib.js deploy/worker.js test/node_libtest.mjs; do node --check "$f"; done
      - name: Node test (log-mel, tokenizer decode, chunking)
        run: |
          curl -sfL --retry 3 -o test/model-small/vocab.json \
            https://huggingface.co/koelony/Qwen3-ASR-0.6B-Cantonese-HK/resolve/main/vocab.json
          node test/node_libtest.mjs | tee "$RUNNER_TEMP/libtest.txt"
          grep -q "tokenizer decode match 20 / 20" "$RUNNER_TEMP/libtest.txt"
          python3 - "$RUNNER_TEMP/libtest.txt" <<'PY'
          import re, sys
          m = re.search(r"maxdiff ([0-9.eE+-]+)", open(sys.argv[1]).read())
          assert m and float(m.group(1)) < 1e-4, "log-mel differs from the Python reference"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: web/dist
          retention-days: 7
